<div class="list__info">
    <h4 class="list__title"><app-icon [icon]="'list'"/> {{ list()?.title }}</h4>
    <button class="btn-options"><app-icon [icon]="'options'"/></button>
</div>
<div class="list__items-container">
    @for (item of recentItems(); track $index) {
        <img class="item-poster" src="{{ item?.poster }}" alt="{{ item?.title }}" />
    }
</div>
<p>{{ list()?.items?.length }} itens</p>
